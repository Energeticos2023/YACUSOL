name: Precios YACUSOL · consistencia
on:
  pull_request:
    paths:
      - 'catalogo/**'
      - 'app.js'
      - 'cotizar/cotizador.js'
      - 'tests/catalogo-consistencia.mjs'
      - 'tests/numero-principal-yacusol.mjs'
      - 'index.html'
      - 'comercial/red-comercial.js'
      - 'asistente/asistente.js'
      - '.github/workflows/catalogo-consistencia.yml'
  push:
    branches: [main]
    paths:
      - 'catalogo/**'
      - 'app.js'
      - 'cotizar/cotizador.js'
      - 'tests/catalogo-consistencia.mjs'
permissions:
  contents: read
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/catalogo-consistencia.mjs
      - run: node tests/numero-principal-yacusol.mjs
